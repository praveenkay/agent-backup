[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-backup"
version = "1.0.0"
description = "Universal AI Agent Backup & Restore Tool — supports Hermes, Claude Code, Codex, OpenCode, and any agent framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Praveen Kothapally", email = "praveenkay@gmail.com"}
]
keywords = ["ai", "agent", "backup", "restore", "hermes", "claude-code", "codex", "opencode", "telegram", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "python-telegram-bot>=21.0; extra=='telegram'",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.0"]
dev = ["pytest>=7.0", "black", "ruff", "mypy"]

[project.scripts]
agent-backup = "agent_backup:main"
agent-backup-bot = "agent_backup:telegram_bot_main"

[project.urls]
Homepage = "https://github.com/praveenkay/agent-backup"
Documentation = "https://github.com/praveenkay/agent-backup#readme"
Repository = "https://github.com/praveenkay/agent-backup"
Issues = "https://github.com/praveenkay/agent-backup/issues"
Releases = "https://github.com/praveenkay/agent-backup/releases"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agent_backup"]

[tool.black]
line-length = 110
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 110
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
